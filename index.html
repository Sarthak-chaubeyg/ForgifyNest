    <!-- FAQ JSON-LD Schema (Google Search & Answer Engine Optimization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Where are my files stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your files are not stored on any server, nor are they saved in your browser's persistent database. CipherNest operates on-the-fly. When you encrypt a file, it is processed locally in browser memory and immediately downloaded back to your hard drive as an encrypted .cnest package. Close the tab, and your memory is entirely cleared."
            }
          },
          {
            "@type": "Question",
            "name": "Do you see my password?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Never. All key derivation (PBKDF2) is executed inside a local Web Worker thread on your CPU. No password or derived key is ever transmitted over the network or logged in console logs."
            }
          },
          {
            "@type": "Question",
            "name": "Can the site read my files?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Because the application is served as static HTML, CSS, and JS with a strict Content Security Policy (CSP), it has no server connections. It cannot upload your data. You can inspect the source code to verify this, or load the page and disconnect your internet entirely - the app will work perfectly offline."
            }
          },
          {
            "@type": "Question",
            "name": "What happens if I lose my password?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Because we have zero storage and zero knowledge of your keys, we cannot recover your password or files. Without your master passphrase, the files are mathematically unrecoverable."
            }
          },
          {
            "@type": "Question",
            "name": "Is this truly quantum-proof?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We do not make hype-based claims. Standard symmetric encryption like AES-256 is theoretically resistant to quantum brute-forcing (reducing its strength to a still-unbreakable 128-bits of security under Grover's algorithm). We've built versioning directly into our file format so that if future quantum-safe key exchange algorithms are standardized in the Web Crypto API, the structure is ready for migration."
            }
          }
        ]
      }
